services:
  db:
    image: postgres:16-alpine
    container_name: bookleaf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookleaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookleaf}
      POSTGRES_DB: ${POSTGRES_DB:-bookleaf}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bookleaf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookleaf} -d ${POSTGRES_DB:-bookleaf}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookleaf_pgdata:
